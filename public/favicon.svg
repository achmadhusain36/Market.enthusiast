<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#080c14"/>
      <stop offset="100%" stopColor="#04060a"/>
    </linearGradient>
    <linearGradient id="favGrad" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2962ff"/>
      <stop offset="50%" stopColor="#00c853"/>
      <stop offset="100%" stopColor="#00e5ff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stopColor="#2962ff" stop-opacity="0.3"/>
      <stop offset="100%" stopColor="#00c853" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#253247" stroke-width="2"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#glowGrad)"/>

  <!-- Candlestick Bar 1 (Bullish green) -->
  <line x1="20" y1="26" x2="20" y2="48" stroke="#00c853" stroke-width="2" stroke-linecap="round"/>
  <rect x="17" y="30" width="6" height="12" rx="1.5" fill="#00c853"/>

  <!-- Candlestick Bar 2 (Blue) -->
  <line x1="33" y1="18" x2="33" y2="44" stroke="#2962ff" stroke-width="2" stroke-linecap="round"/>
  <rect x="30" y="22" width="6" height="14" rx="1.5" fill="#2962ff"/>

  <!-- Ascending Trend Line with Glow -->
  <path d="M14 44L26 31L36 36L50 16" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Target Peak Pulse -->
  <circle cx="50" cy="16" r="4.5" fill="#ffffff" stroke="#00e5ff" stroke-width="2"/>
</svg>
